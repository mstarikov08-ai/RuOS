name: Build RuOS Launcher Beta APK

on:
  push:
    branches: [claude/ruos-android-rom-oi3wt1]
  workflow_dispatch:

jobs:
  build:
    name: Build Launcher APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Download gradle-wrapper.jar
        run: |
          curl -fsSL -o studio/gradle/wrapper/gradle-wrapper.jar \
            "https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar"

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > studio/local.properties

      - name: Make gradlew executable
        run: chmod +x studio/gradlew

      - name: Build launcher debug APK
        working-directory: studio
        run: ./gradlew :launcher:assembleDebug --no-daemon --stacktrace

      - name: Rename APK with build info
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          cp studio/launcher/build/outputs/apk/debug/launcher-debug.apk \
             RuOS-Launcher-beta-${SHORT_SHA}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RuOS-Launcher-beta
          path: RuOS-Launcher-beta-*.apk
          retention-days: 90

      - name: Print download instructions
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo " RuOS Launcher Beta APK ready!"
          echo ""
          echo " To install on your Pixel:"
          echo " 1. Go to Actions tab → this workflow run"
          echo " 2. Scroll to Artifacts → download RuOS-Launcher-beta"
          echo " 3. Unzip → copy APK to phone"
          echo " 4. In Settings → Security → allow install from Files"
          echo " 5. Tap the APK → Install → set as default Home app"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
